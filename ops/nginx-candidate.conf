server {
    listen 127.0.0.1:8082;
    server_name _;
    root /var/www/ipms/candidate/frontend;
    index index.html;
    client_max_body_size 24m;
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/ipms/candidate/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/ipms/candidate/backend/public;
        fastcgi_pass unix:/run/php/itpms-fpm.sock;
    }
    location ~ /\. { deny all; }
    location /storage { deny all; }
}
