server {
    listen 80 default_server;
    server_name _;
    root /var/www/ipms/current/frontend;
    index index.html;
    client_max_body_size 24m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { deny all; }
    location /storage { deny all; }
    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/ipms/current/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/ipms/current/backend/public;
        fastcgi_pass unix:/run/php/itpms-fpm.sock;
    }
    location ~ \.php$ { deny all; }
}
